<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jack Scott</title>
  <desc id="desc">Software engineer focused on Windows tooling, automation, and backend systems</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282A36"/>
      <stop offset="1" stop-color="#21222C"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="18%" r="72%">
      <stop offset="0" stop-color="#BD93F9" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#6272A4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#282A36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8BE9FD"/>
      <stop offset="0.5" stop-color="#BD93F9"/>
      <stop offset="1" stop-color="#FF79C6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#44475A" stroke-width="1" opacity="0.32"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#purpleGlow)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)" opacity="0.7"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#44475A" stroke-width="2"/>
  <rect x="0" y="0" width="8" height="320" rx="4" fill="url(#accent)"/>

  <g aria-hidden="true">
    <circle cx="52" cy="42" r="6" fill="#FF5555"/>
    <circle cx="73" cy="42" r="6" fill="#FFB86C"/>
    <circle cx="94" cy="42" r="6" fill="#50FA7B"/>
    <text x="116" y="47" fill="#6272A4" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2">JACKSCOTT7 / PROFILE</text>
  </g>

  <g transform="translate(58 92)">
    <rect width="116" height="116" rx="24" fill="#282A36" stroke="#6272A4" stroke-width="2"/>
    <rect x="10" y="10" width="96" height="96" rx="18" fill="#44475A" opacity="0.65"/>
    <text x="58" y="73" text-anchor="middle" fill="#50FA7B" font-family="Cascadia Code, Consolas, monospace" font-size="42" font-weight="700" filter="url(#softGlow)">&gt;_</text>
  </g>

  <g transform="translate(208 98)">
    <text x="0" y="54" fill="#F8F8F2" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="3">JACK SCOTT</text>
    <text x="2" y="94" fill="#BD93F9" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Windows tooling · Automation · Backend systems</text>
    <text x="2" y="132" fill="#6272A4" font-family="Cascadia Code, Consolas, monospace" font-size="17">&gt; shipping practical software that removes friction_</text>
  </g>

  <g aria-hidden="true" opacity="0.9">
    <circle cx="1040" cy="116" r="74" fill="none" stroke="#BD93F9" stroke-width="2" opacity="0.35"/>
    <circle cx="1040" cy="116" r="52" fill="none" stroke="#8BE9FD" stroke-width="2" opacity="0.28"/>
    <circle cx="1040" cy="116" r="28" fill="#FF79C6" opacity="0.12"/>
    <path d="M969 228h141" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M990 246h99" stroke="#44475A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(58 263)" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1">
    <rect width="98" height="30" rx="15" fill="#44475A"/>
    <text x="49" y="20" text-anchor="middle" fill="#F1FA8C">PYTHON</text>
    <rect x="110" width="98" height="30" rx="15" fill="#44475A"/>
    <text x="159" y="20" text-anchor="middle" fill="#BD93F9">C# / .NET</text>
    <rect x="220" width="108" height="30" rx="15" fill="#44475A"/>
    <text x="274" y="20" text-anchor="middle" fill="#8BE9FD">WINDOWS</text>
  </g>
</svg>
